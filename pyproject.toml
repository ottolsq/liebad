[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "liebad"
version = "0.1.0"
description = "Local real-time Chinese captions for Windows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av==15.1.0",
    "faster-whisper==1.2.1",
    "opencc-python-reimplemented==0.1.7",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
